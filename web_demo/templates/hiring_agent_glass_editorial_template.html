<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Glass Editorial UI template for the Hiring Agent web demo." />
  <title>HireLens — Hiring Agent Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /*
      Hiring Agent — Glass Editorial UI Template
      ---------------------------------------------------------------
      This is a standalone, framework-free mock UI. The coding agent can:
      1) copy the visual tokens/components into Next.js/Tailwind;
      2) replace mockApi methods with real fetch() calls;
      3) split each hash route into the corresponding app route.

      Suggested route mapping:
        #/login                         -> /login
        #/candidate                     -> /candidate
        #/staff/applications            -> /staff/applications
        #/staff/application/:id         -> /staff/applications/[id]
        #/staff/experiments             -> /staff/experiments
        #/staff/models                  -> /staff/models
        #/staff/runs                    -> /staff/runs
        #/staff/demo                    -> /staff/demo
    */

    :root {
      --page-bg: #f5f9fd;
      --page-bg-deep: #e7f0f8;
      --surface-nav: rgba(248, 252, 255, 0.62);
      --surface-card: rgba(255, 255, 255, 0.74);
      --surface-raised: rgba(255, 255, 255, 0.93);
      --surface-subtle: rgba(239, 247, 253, 0.54);
      --text-primary: #1d2b3a;
      --text-secondary: #607489;
      --text-soft: #8a9bad;
      --accent: #5b8fca;
      --accent-soft: rgba(91, 143, 202, 0.12);
      --accent-mid: rgba(91, 143, 202, 0.22);
      --sage: #6d9d9a;
      --sage-soft: rgba(109, 157, 154, 0.13);
      --amber: #a57f49;
      --amber-soft: rgba(165, 127, 73, 0.13);
      --danger: #b45e68;
      --danger-soft: rgba(180, 94, 104, 0.12);
      --border: rgba(58, 91, 122, 0.14);
      --border-strong: rgba(58, 91, 122, 0.24);
      --shadow-soft: 0 20px 60px rgba(43, 78, 112, 0.09);
      --shadow-float: 0 18px 48px rgba(43, 78, 112, 0.13);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 26px;
      --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --font-body: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text-primary);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 11% 8%, rgba(91, 143, 202, 0.15), transparent 30%),
        radial-gradient(circle at 92% 74%, rgba(119, 177, 196, 0.13), transparent 32%),
        linear-gradient(135deg, var(--page-bg), var(--page-bg-deep));
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: 0;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    [hidden] { display: none !important; }

    :focus-visible {
      outline: 3px solid rgba(91, 143, 202, 0.28);
      outline-offset: 2px;
    }

    .app-root { position: relative; z-index: 1; min-height: 100vh; }
    .display { font-family: var(--font-display); }
    .mono { font-family: var(--font-mono); }
    .muted { color: var(--text-secondary); }
    .soft { color: var(--text-soft); }
    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .section-number {
      display: inline-grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
      background: rgba(255,255,255,.28);
    }

    .glass-nav {
      background: var(--surface-nav);
      border: 1px solid rgba(255,255,255,.58);
      box-shadow: inset 0 0 0 1px var(--border), var(--shadow-soft);
      backdrop-filter: blur(22px) saturate(125%);
      -webkit-backdrop-filter: blur(22px) saturate(125%);
    }
    .glass-card {
      background: var(--surface-card);
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: inset 0 0 0 1px var(--border), var(--shadow-soft);
      backdrop-filter: blur(14px) saturate(118%);
      -webkit-backdrop-filter: blur(14px) saturate(118%);
    }
    .glass-raised {
      background: var(--surface-raised);
      border: 1px solid rgba(255,255,255,.74);
      box-shadow: inset 0 0 0 1px var(--border), var(--shadow-float);
      backdrop-filter: blur(10px) saturate(115%);
      -webkit-backdrop-filter: blur(10px) saturate(115%);
    }

    .btn {
      min-height: 42px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 0 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255,255,255,.34);
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
      font-weight: 600;
      font-size: 14px;
    }
    .btn:hover { background: rgba(255,255,255,.68); border-color: rgba(58,91,122,.34); }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #f8fbff; border-color: var(--accent); }
    .btn-primary:hover { background: #4b7fba; border-color: #4b7fba; }
    .btn-sage { background: var(--sage); color: #f7fcfc; border-color: var(--sage); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(180,94,104,.24); }
    .btn-ghost { border-color: transparent; background: transparent; }
    .btn-square { width: 42px; padding: 0; }
    .btn-sm { min-height: 34px; padding: 0 12px; font-size: 12px; }
    .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

    .field { display: grid; gap: 8px; }
    .field label { font-size: 13px; font-weight: 600; }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--border-strong);
      background: rgba(255,255,255,.52);
      border-radius: 14px;
      min-height: 44px;
      padding: 10px 13px;
      transition: border-color .18s ease, background .18s ease;
    }
    .textarea { min-height: 108px; resize: vertical; }
    .input:hover, .select:hover, .textarea:hover { background: rgba(255,255,255,.72); }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255,255,255,.48);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .75; }
    .pill-success { color: var(--sage); background: var(--sage-soft); }
    .pill-warning { color: var(--amber); background: var(--amber-soft); }
    .pill-danger { color: var(--danger); background: var(--danger-soft); }
    .pill-neutral { color: var(--text-secondary); }
    .pill-accent { color: var(--accent); background: var(--accent-soft); }

    .icon { width: 18px; height: 18px; display: inline-block; vertical-align: middle; }
    .icon-lg { width: 24px; height: 24px; }

    .brand-mark {
      width: 40px; height: 40px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--accent); color: #fffaf5;
      font-family: var(--font-display); font-weight: 700; font-size: 22px;
      box-shadow: 0 12px 26px rgba(91,143,202,.25);
    }

    .login-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(360px, .88fr);
      gap: 34px;
      padding: clamp(22px, 4vw, 58px);
      align-items: stretch;
    }
    .login-story {
      padding: clamp(22px, 5vw, 72px);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 700px;
      overflow: hidden;
      position: relative;
    }
    .login-story::after {
      content: "";
      position: absolute;
      width: 480px; height: 480px; border-radius: 50%;
      right: -160px; bottom: -170px;
      border: 1px solid rgba(91,143,202,.22);
      box-shadow: 0 0 0 70px rgba(91,143,202,.045), 0 0 0 140px rgba(119,177,196,.035);
    }
    .login-title {
      margin: 26px 0 18px;
      max-width: 720px;
      font-family: var(--font-display);
      font-size: clamp(58px, 7.3vw, 110px);
      line-height: .87;
      letter-spacing: -.045em;
      font-weight: 600;
    }
    .login-story p { max-width: 600px; font-size: 17px; line-height: 1.75; }
    .story-flow { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .story-step { border-top: 1px solid var(--border-strong); padding-top: 14px; font-size: 13px; }
    .story-step strong { display: block; margin: 6px 0 3px; }

    .login-panel {
      align-self: center;
      width: min(100%, 520px);
      justify-self: center;
      border-radius: var(--radius-lg);
      padding: clamp(28px, 4vw, 48px);
    }
    .login-panel h1 { margin: 18px 0 6px; font: 600 50px/.95 var(--font-display); }
    .login-form { display: grid; gap: 18px; margin-top: 30px; }
    .demo-accounts { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
    .demo-account-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 12px; }

    .staff-shell { min-height: 100vh; padding: 18px; display: grid; grid-template-columns: 256px minmax(0,1fr); gap: 18px; }
    .sidebar {
      min-height: calc(100vh - 36px);
      position: sticky; top: 18px; align-self: start;
      border-radius: 24px; padding: 20px 16px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px; border-bottom: 1px solid var(--border); }
    .sidebar-brand .name { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: .9; }
    .sidebar-brand .sub { color: var(--text-secondary); font-size: 11px; margin-top: 5px; }
    .nav-group { margin-top: 23px; }
    .nav-label { padding: 0 12px 8px; color: var(--text-soft); font-size: 10px; font-weight: 700; letter-spacing: .14em; }
    .nav-link {
      display: flex; align-items: center; gap: 11px;
      min-height: 43px; padding: 0 12px; border-radius: 13px;
      color: var(--text-secondary); font-weight: 600; font-size: 13px;
      border: 1px solid transparent;
      transition: background .18s ease, color .18s ease;
    }
    .nav-link:hover { background: rgba(255,255,255,.36); color: var(--text-primary); }
    .nav-link.active { color: var(--text-primary); background: var(--accent-soft); border-color: rgba(91,143,202,.15); }
    .sidebar-footer { margin-top: auto; padding: 16px 8px 0; border-top: 1px solid var(--border); }
    .user-chip { display: flex; gap: 10px; align-items: center; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--sage-soft); color: var(--sage); font-weight: 700; }

    .staff-main { min-width: 0; }
    .topbar {
      min-height: 68px; border-radius: 20px; padding: 10px 14px 10px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      position: sticky; top: 18px; z-index: 20;
    }
    .topbar-left, .topbar-actions { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .breadcrumb { font-size: 13px; color: var(--text-secondary); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .model-control { display: flex; align-items: center; gap: 10px; min-width: 250px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,.4); }
    .model-control select { border: 0; outline: 0; background: transparent; min-width: 155px; font-size: 12px; font-weight: 700; }
    .defense-control { min-width: 205px; }
    .defense-control select { min-width: 135px; }
    .health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 0 4px var(--sage-soft); }

    .demo-switch { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 700; }
    .switch { width: 42px; height: 24px; border: 1px solid var(--border-strong); border-radius: 999px; padding: 2px; background: rgba(255,255,255,.44); }
    .switch span { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--text-soft); transition: transform .2s ease, background .2s ease; }
    .switch.on span { transform: translateX(18px); background: var(--accent); }

    .mobile-menu { display: none; }
    .page { padding: 36px 10px 70px; max-width: 1680px; margin: 0 auto; }
    .page-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; margin-bottom: 28px; }
    .page-title { margin: 7px 0 0; font: 600 clamp(50px, 6vw, 88px)/.84 var(--font-display); letter-spacing: -.045em; max-width: 760px; }
    .page-title.small { font-size: clamp(44px, 5vw, 70px); }
    .page-intro { max-width: 460px; color: var(--text-secondary); line-height: 1.65; font-size: 14px; padding-bottom: 5px; }
    .page-intro strong { color: var(--text-primary); }

    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 22px; }
    .metric { padding: 18px; border-top: 2px solid transparent; border-radius: 18px; }
    .metric:nth-child(1) { border-color: var(--accent); }
    .metric:nth-child(2) { border-color: var(--sage); }
    .metric:nth-child(3) { border-color: var(--amber); }
    .metric:nth-child(4) { border-color: var(--danger); }
    .metric-label { color: var(--text-secondary); font-size: 12px; }
    .metric-value { margin-top: 7px; font: 600 38px/1 var(--font-display); }
    .metric-note { margin-top: 7px; color: var(--text-soft); font-size: 11px; }

    .toolbar { display: grid; grid-template-columns: minmax(220px,1fr) repeat(3, minmax(145px,.35fr)); gap: 10px; padding: 14px; border-radius: 18px; margin-bottom: 14px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 13px; top: 13px; color: var(--text-soft); }
    .search-wrap input { padding-left: 40px; }

    .table-shell { border-radius: 22px; overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 980px; }
    th { text-align: left; padding: 15px 16px; font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--text-soft); border-bottom: 1px solid var(--border-strong); }
    td { padding: 17px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .16s ease; }
    tbody tr:hover { background: rgba(255,255,255,.38); }
    .clickable-row { cursor: pointer; }
    .rank { font: 600 21px/1 var(--font-display); color: var(--text-secondary); }
    .candidate-cell { display: flex; align-items: center; gap: 11px; min-width: 230px; }
    .candidate-cell .avatar { width: 38px; height: 38px; }
    .candidate-name { font-weight: 700; }
    .candidate-meta { margin-top: 4px; color: var(--text-secondary); font-size: 11px; }
    .score-number { font: 600 24px/1 var(--font-display); }
    .score-mini { width: 82px; height: 5px; margin-top: 6px; background: rgba(58,91,122,.10); border-radius: 999px; overflow: hidden; }
    .score-mini span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }

    .empty-state { padding: 70px 24px; text-align: center; }
    .empty-state h3 { margin: 16px 0 8px; font: 600 34px/1 var(--font-display); }

    .detail-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 24px; align-items: end; margin-bottom: 22px; }
    .candidate-title { margin: 8px 0 0; font: 600 clamp(56px,7vw,94px)/.78 var(--font-display); letter-spacing: -.045em; }
    .detail-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; }
    .detail-grid { display: grid; grid-template-columns: minmax(270px,.78fr) minmax(300px,.94fr) minmax(320px,1.05fr); gap: 14px; align-items: start; }
    .panel { border-radius: 20px; padding: 18px; min-width: 0; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 13px; border-bottom: 1px solid var(--border); }
    .panel-title { font-weight: 700; font-size: 14px; }
    .panel-sub { color: var(--text-secondary); font-size: 11px; margin-top: 3px; }

    .pdf-frame { min-height: 740px; margin-top: 14px; border: 1px solid var(--border-strong); border-radius: 14px; background: #fbfdff; padding: 34px 30px; box-shadow: inset 0 0 28px rgba(43,78,112,.05); overflow: hidden; }
    .pdf-preview { height: clamp(460px, var(--pdf-preview-height, 620px), 740px); margin-top: 14px; border: 1px solid var(--border-strong); border-radius: 14px; overflow: hidden; background: #fbfdff; }
    .pdf-preview iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .pdf-preview-message { display: grid; min-height: 260px; place-items: center; padding: 28px; text-align: center; color: var(--text-secondary); }
    .run-details-panel details { margin-top: 16px; }
    .run-detail-actions { margin-top: 15px; display: grid; gap: 8px; }
    .pdf-name { font: 700 34px/1 var(--font-display); }
    .pdf-contact { margin-top: 8px; color: #64778a; font-size: 9px; }
    .pdf-rule { margin: 15px 0; border-top: 1px solid #c6d4e1; }
    .pdf-section { margin-top: 18px; }
    .pdf-section h4 { margin: 0 0 7px; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .pdf-section p, .pdf-section li { font-family: Georgia, serif; font-size: 8.5px; line-height: 1.55; color: #283a4c; }
    .pdf-section ul { padding-left: 15px; }

    .resume-section { padding: 17px 0; border-bottom: 1px solid var(--border); }
    .resume-section:last-child { border-bottom: 0; }
    .resume-section h3 { margin: 0 0 12px; font: 600 25px/1 var(--font-display); }
    .timeline-item { position: relative; padding-left: 19px; margin: 14px 0; }
    .timeline-item::before { content: ""; position: absolute; left: 1px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .timeline-item::after { content: ""; position: absolute; left: 4px; top: 17px; bottom: -17px; width: 1px; background: var(--border-strong); }
    .timeline-item:last-child::after { display: none; }
    .timeline-item strong { font-size: 13px; }
    .timeline-item p { margin: 5px 0 0; color: var(--text-secondary); font-size: 12px; line-height: 1.55; }
    .parsed-lines { display: grid; gap: 8px; }
    .parsed-line { margin: 0; padding-left: 14px; position: relative; color: var(--text-secondary); font-size: 12px; line-height: 1.55; }
    .parsed-line::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .tag-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { padding: 6px 9px; border-radius: 999px; background: rgba(255,255,255,.44); border: 1px solid var(--border); font-size: 11px; }

    .score-hero { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 15px; align-items: center; margin: 18px 0; }
    .score-ring { width: 106px; height: 106px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) 0 86%, rgba(58,91,122,.10) 86% 100%); position: relative; }
    .score-ring::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--surface-raised); }
    .score-ring span { position: relative; z-index: 1; font: 600 34px/1 var(--font-display); }
    .score-copy h3 { margin: 0; font: 600 26px/1 var(--font-display); }
    .score-copy p { margin: 7px 0 0; color: var(--text-secondary); font-size: 12px; line-height: 1.5; }
    .score-breakdown { display: grid; gap: 14px; }
    .score-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: end; }
    .score-row .label { font-size: 12px; font-weight: 700; }
    .score-row .value { font-family: var(--font-mono); font-size: 11px; }
    .bar { grid-column: 1 / -1; height: 7px; background: rgba(58,91,122,.10); border-radius: 999px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #8bb8e1); border-radius: inherit; }
    .score-adjustments { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin: 16px 0; }
    .adjustment { padding: 10px; border-radius: 12px; background: rgba(255,255,255,.36); border: 1px solid var(--border); }
    .adjustment span { display: block; color: var(--text-secondary); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
    .adjustment strong { display: block; margin-top: 5px; font-family: var(--font-mono); font-size: 12px; }

    details { border-top: 1px solid var(--border); }

        const body = await response.json().catch(() => ({}));
        if (response.status === 401 && token) { expireSession(); throw new Error('Session expired. Please sign in again.'); }

    function filteredCandidates() {
      const filters = state.applicationFilters;
      let rows = [...candidates];
      if (filters.search) {
        const q = filters.search.toLowerCase();
        rows = rows.filter(candidate => `${candidate.name} ${candidate.email} ${candidate.role}`.toLowerCase().includes(q));
      }
      if (filters.status !== 'all') rows = rows.filter(candidate => candidate.candidateStatus === filters.status);
      if (filters.decision !== 'all') rows = rows.filter(candidate => candidate.decision === filters.decision);
      rows.sort((a,b) => {
        if (filters.sort === 'score_asc') return a.score - b.score;
        if (filters.sort === 'name_asc') return a.name.localeCompare(b.name);
        if (filters.sort === 'submitted_desc') return b.submitted.localeCompare(a.submitted);
        return b.score - a.score;
      });
      return rows;
    }

    async function loadPdfPreview(applicationId) {
      const target = document.getElementById('pdfPreview');
      if (!target) return;
      try {
        const blob = await apiFile(`/api/staff/applications/${encodeURIComponent(applicationId)}/pdf`);
        let metadata = null;
        try { metadata = await api(`/api/staff/applications/${encodeURIComponent(applicationId)}/pdf-meta`); } catch (_) { /* Preview remains available without sizing metadata. */ }
        const pageCount = Math.max(1, Number(metadata?.page_count) || 1);
        target.style.setProperty('--pdf-preview-height', `${Math.min(740, 360 + pageCount * 130)}px`);
        target.dataset.pageCount = String(pageCount);
        const url = URL.createObjectURL(blob);
        target.innerHTML = `<iframe title="Original uploaded resume PDF" src="${url}#toolbar=0"></iframe>`;
        document.querySelector('[data-download-pdf]')?.addEventListener('click', () => {
          const link = document.createElement('a'); link.href = url; link.download = 'resume.pdf'; link.click();
        }, { once: true });
      } catch (error) {
        target.innerHTML = `<div class="pdf-preview-message">${escapeHtml(error.message)}<br/><span class="soft">The original PDF is unavailable for seeded records.</span></div>`;
      }
    }

    function pipelineHtml(run) {
      if (run.stageSummary && run.stageSummary.length) {
        return `<div class="pipeline">${run.stageSummary.map((stage,index) => {
          const status=String(stage.status || '').toLowerCase();
          const state=status === 'completed' ? 'done' : status === 'running' ? 'running' : status.includes('fail') ? 'failed' : 'queued';
          return `<div class="pipeline-step ${state === 'running' ? 'running' : state === 'failed' ? 'failed' : ''}"><div class="pipeline-dot">${state === 'done' ? '✓' : state === 'running' ? '…' : state === 'failed' ? '!' : String(index+1).padStart(2,'0')}</div><div><div class="pipeline-name">${escapeHtml(stage.name)}</div><div class="pipeline-note">${escapeHtml(stage.note || 'No stage note')}</div></div><div class="pipeline-time">${formatDuration(stage.duration_ms)}</div></div>`;
        }).join('')}</div>`;
      }
      const stages = run.status === 'FAILED' ? stagePresets.failed : run.status === 'RUNNING' ? stagePresets.running : stagePresets.completed;
      return `<div class="pipeline">${stages.map((stage,index) => `<div class="pipeline-step ${stage.status === 'running' ? 'running' : stage.status === 'failed' ? 'failed' : ''}"><div class="pipeline-dot">${stage.status === 'done' ? '✓' : stage.status === 'running' ? '…' : stage.status === 'failed' ? '!' : String(index+1).padStart(2,'0')}</div><div><div class="pipeline-name">${stage.name}</div><div class="pipeline-note">${stage.note}</div></div><div class="pipeline-time">${stage.time}</div></div>`).join('')}</div>`;
    }

      const content = `
        ${pageHeader('Demo Controls', 'Presentation<br/>Workspace', 'Prepare a stable classroom demonstration without changing the core business logic.', `<button class="btn btn-primary" data-demo-toggle-page>${state.demoMode ? 'Disable' : 'Enable'} Demo Mode</button>`)}
        <section class="compare-grid">
          <article class="panel glass-card"><div class="eyebrow">01 / Data state</div><h2 class="display" style="font-size:42px;line-height:1;margin:10px 0">Seed and reset</h2><p class="muted" style="font-size:13px;line-height:1.65">Restore the fixed five-candidate cohort, historical runs and deterministic review state.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px"><button class="btn btn-primary" data-seed-demo>Seed demo data</button><button class="btn btn-danger" data-reset-demo>Reset demo data</button></div></article>
          <article class="panel glass-card"><div class="eyebrow">02 / View shortcuts</div><h2 class="display" style="font-size:42px;line-height:1;margin:10px 0">Move through the story</h2><p class="muted" style="font-size:13px;line-height:1.65">Open the candidate upload, staff review, rerun and comparison screens in the intended presentation order.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px"><button class="btn" data-open-candidate>Candidate view</button><button class="btn" data-go="/staff/applications">Review queue</button><button class="btn" data-go="/staff/application/app-alice">Alice detail</button><button class="btn" data-go="/staff/experiments">Compare runs</button></div></article>
        </section>
        <section class="panel glass-raised" style="margin-top:14px"><div class="panel-head"><div><div class="panel-title">Guided demo sequence</div><div class="panel-sub">Suggested 15-minute flow</div></div><span class="pill pill-accent">4 steps</span></div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px">
          ${[['01','Candidate upload','Show PDF input and candidate privacy.'],['02','AI screening','Open structured resume, evidence and ranking.'],['03','Model rerun','Switch the model without restarting services.'],['04','Run comparison','Compare immutable outputs and technical traces.']].map(item => `<div style="padding:15px;border-top:1px solid var(--border-strong)"><span class="section-number">${item[0]}</span><strong style="display:block;margin-top:10px;font-size:13px">${item[1]}</strong><span class="muted" style="display:block;margin-top:6px;font-size:11px;line-height:1.5">${item[2]}</span></div>`).join('')}
        </div></section>
        <section class="panel glass-card" style="margin-top:14px"><div class="eyebrow">03 / Backend profile</div><h2 class="display" style="font-size:38px;margin:9px 0">Attack and defense controls</h2><p class="muted" style="font-size:13px;line-height:1.7;max-width:900px">Choose the backend profile for new uploads and reruns. Each choice is stored in the immutable Evaluation Run configuration, so the Experiments view can compare the same PDF under different defenses.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">${defenseProfiles.map(profile => `<button class="btn ${profile.id === state.defaultDefenseProfile ? 'btn-primary' : ''}" data-set-defense="${profile.id}">${profile.name}</button>`).join('')}</div><div class="code-box" style="margin-top:14px">Active profile: ${escapeHtml(currentDefenseProfile().name)} — ${escapeHtml(currentDefenseProfile().description)}</div></section>`;
      return staffShell({ name: 'demo' }, content, 'Demo Controls');
    }

    function rerunModal(candidate) {
      showModal(`
        <div class="modal-head"><div><div class="eyebrow">New evaluation run</div><h2>Rerun ${candidate.name}</h2></div><button class="btn btn-square btn-ghost" data-close-modal>${icons.close}</button></div>
        <div class="modal-body">
          <div class="field"><label for="rerunModel">Model</label><select class="select" id="rerunModel">${models.filter(model => model.healthy).map(model => `<option value="${model.id}" ${model.id === state.defaultModel ? 'selected' : ''}>${model.name} · ${model.type}</option>`).join('')}</select></div>
          <div class="field"><label for="rerunDefense">Defense profile</label><select class="select" id="rerunDefense">${defenseProfiles.map(profile => `<option value="${profile.id}" ${profile.id === state.defaultDefenseProfile ? 'selected' : ''}>${profile.name} — ${profile.description}</option>`).join('')}</select><small class="muted">V3-VLM requires the Qwen3-VL Plus model and fails closed if visual extraction cannot complete.</small></div>
          <div class="field"><label for="rerunGithubFixture">Controlled GitHub scenario</label><select class="select" id="rerunGithubFixture">${githubFixtures.map(fixture => `<option value="${fixture.id}">${fixture.name} — ${fixture.description}</option>`).join('')}</select><small class="muted">Fixture is an input scenario, separate from the defense choice. Local only; no live GitHub account is queried.</small></div>
          <div class="form-grid-2"><div class="field"><label for="rerunTemperature">Temperature</label><input class="input" id="rerunTemperature" type="number" min="0" max="2" step="0.1" value="0.1" /></div><div class="field"><label for="rerunTopP">Top-p</label><input class="input" id="rerunTopP" type="number" min="0" max="1" step="0.1" value="0.9" /></div></div>
          <div class="form-grid-2"><div class="field"><label for="rerunPrompt">Prompt version</label><select class="select" id="rerunPrompt"><option>baseline-v1</option></select></div><div class="field"><label for="rerunCache">Cache policy</label><select class="select" id="rerunCache"><option value="FORCE_FRESH">Force fresh</option><option value="SAFE_REUSE">Safe reuse</option></select></div></div>
          <label style="display:flex;align-items:center;gap:10px;font-size:13px"><input id="rerunGithub" type="checkbox" checked /> Enable GitHub enrichment</label>
          <div class="code-box">A new immutable Evaluation Run will be created. Existing scores and artifacts remain unchanged.</div>
        </div>
        <div class="modal-actions"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-confirm-rerun="${candidate.id}">${icons.refresh} Run evaluation</button></div>`);
    }
    function deleteCandidateModal(candidate) {
      showModal(`
        <div class="modal-head"><div><div class="eyebrow">Delete application</div><h2>Delete ${escapeHtml(candidate.name)}?</h2></div><button class="btn btn-square btn-ghost" data-close-modal>${icons.close}</button></div>
        <div class="modal-body"><p class="muted" style="line-height:1.65">This permanently deletes the candidate record, every Evaluation Run, stage artifact and locally managed uploaded PDF. This cannot be undone.</p><div class="code-box">Application ID: ${escapeHtml(candidate.id)}</div></div>
        <div class="modal-actions"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-danger" data-confirm-delete="${candidate.id}">Delete permanently</button></div>`);
    }

    function artifactModal(type) {
      const payloads = {
        text: '# Extracted Resume\n\nAlice Chen\nSenior Backend Engineer...\n\n## Work\nRed Maple Robotics...',
        resume: JSON.stringify({ basics: { name: 'Alice Chen', email: 'alice@example.com' }, work: [{ name: 'Red Maple Robotics', position: 'Senior Backend Engineer' }], skills: [{ name: 'Infrastructure', keywords: ['Go','Kubernetes','PostgreSQL'] }] }, null, 2),
        evaluation: JSON.stringify({ base_score: 87, bonus: 6, deductions: 1.5, adjusted_score: 91.5, review_tier: 'High Priority', human_review_required: true }, null, 2)
      };
      showModal(`<div class="modal-head"><div><div class="eyebrow">Raw artifact</div><h2>${escapeHtml(type)}</h2></div><button class="btn btn-square btn-ghost" data-close-modal>${icons.close}</button></div><div class="modal-body"><pre class="code-box" style="max-height:500px;white-space:pre-wrap">${escapeHtml(payloads[type] || '')}</pre></div><div class="modal-actions"><button class="btn btn-primary" data-close-modal>Close</button></div>`);
    }
    async function handleResume(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.pdf') && file.type !== 'application/pdf') {
        showToast('Upload rejected', 'Please choose a valid PDF file.', 'danger');
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        showToast('Upload rejected', 'The maximum PDF size is 10 MB.', 'danger');
        return;
      }
      state.candidateStatus = 'PROCESSING';
      render();
      try {
        state.uploadedFile = await mockApi.uploadResume(file);
        showToast('Resume uploaded', 'A new evaluation run has been queued.');
        render();
        setTimeout(() => {
          state.candidateStatus = 'UNDER_REVIEW';
          if (routeFromHash().name === 'candidate') render();
          showToast('Processing complete', 'Your application is now under human review.');
        }, 1800);
      } catch (error) {
        showToast('Upload failed', error.message, 'danger');
      }
    }

    function bindGlobal() {
      document.querySelectorAll('[data-logout]').forEach(button => button.addEventListener('click', () => { sessionStorage.removeItem('hiring_agent_token'); state.user = null; navigate('/login'); }));
      document.querySelectorAll('[data-mobile-menu]').forEach(button => button.addEventListener('click', () => { state.mobileNavOpen = true; render(); }));
      document.querySelectorAll('[data-sidebar-overlay]').forEach(node => node.addEventListener('click', () => { state.mobileNavOpen = false; render(); }));
      document.querySelectorAll('[data-demo-toggle],[data-demo-toggle-page]').forEach(button => button.addEventListener('click', () => { state.demoMode = !state.demoMode; render(); showToast('Demo Mode', state.demoMode ? 'Presentation-focused controls are enabled.' : 'Standard staff view restored.'); }));
      document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => navigate(button.dataset.go)));
      document.querySelectorAll('[data-open-candidate]').forEach(button => button.addEventListener('click', () => navigate('/candidate')));
      document.querySelectorAll('[data-top-model]').forEach(select => select.addEventListener('change', async () => {
        await mockApi.setDefaultModel(select.value);
        state.defaultModel = select.value;
        render();
        showToast('Default model updated', `${currentModel().name} will be used for new runs.`);
      }));
      document.querySelectorAll('[data-top-defense]').forEach(select => select.addEventListener('change', async () => {
        await mockApi.setDefaultDefenseProfile(select.value);
        state.defaultDefenseProfile = select.value;
        render();
        showToast('Default defense updated', `${currentDefenseProfile().name} will be used for new runs.`);
      }));
      document.querySelectorAll('[data-toast]').forEach(button => button.addEventListener('click', () => showToast('Template interaction', button.dataset.toast, 'warning')));
      document.querySelectorAll('[data-health-check]').forEach(button => button.addEventListener('click', () => showToast('Health check complete', 'API, worker and configured model providers are reachable.')));
    }

    function bindLogin() {
      document.querySelectorAll('[data-fill-account]').forEach(button => button.addEventListener('click', () => {
        document.getElementById('loginEmail').value = button.dataset.fillAccount;
        document.getElementById('loginPassword').value = 'demo123';
      }));
      document.getElementById('loginForm')?.addEventListener('submit', async event => {
        event.preventDefault();
        const button = document.getElementById('loginButton');
        const error = document.getElementById('loginError');
        button.disabled = true;
        button.textContent = 'Signing in…';
        error.hidden = true;
        try {
          state.user = await mockApi.login(document.getElementById('loginEmail').value.trim(), document.getElementById('loginPassword').value);
          await syncStaffData();
          navigate(state.user.role === 'staff' ? '/staff/applications' : '/candidate');
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
          button.disabled = false;
          button.innerHTML = `Sign in ${icons.arrow}`;
        }
      });
    }

    function bindCandidate() {
      const input = document.getElementById('resumeInput');
      document.querySelectorAll('[data-choose-file]').forEach(button => button.addEventListener('click', () => input?.click()));
      input?.addEventListener('change', event => handleResume(event.target.files?.[0]));
      const zone = document.getElementById('uploadZone');
      if (zone) {
        ['dragenter','dragover'].forEach(type => zone.addEventListener(type, event => { event.preventDefault(); zone.classList.add('dragging'); }));
        ['dragleave','drop'].forEach(type => zone.addEventListener(type, event => { event.preventDefault(); zone.classList.remove('dragging'); }));
        zone.addEventListener('drop', event => handleResume(event.dataTransfer.files?.[0]));
      }
    }

    function bindApplications() {
      document.querySelector('[data-filter-search]')?.addEventListener('input', event => { state.applicationFilters.search = event.target.value; renderApplicationsOnly(); });
      document.querySelector('[data-filter-status]')?.addEventListener('change', event => { state.applicationFilters.status = event.target.value; render(); });
      document.querySelector('[data-filter-decision]')?.addEventListener('change', event => { state.applicationFilters.decision = event.target.value; render(); });
      document.querySelector('[data-filter-sort]')?.addEventListener('change', event => { state.applicationFilters.sort = event.target.value; render(); });
      document.querySelector('[data-clear-filters]')?.addEventListener('click', () => { state.applicationFilters = { search: '', status: 'all', decision: 'all', sort: 'score_desc' }; render(); });
      document.querySelectorAll('[data-open-application]').forEach(row => row.addEventListener('click', event => {
        if (event.target.closest('button')) return;
        navigate(`/staff/application/${row.dataset.openApplication}`);
      }));
    }

    function renderApplicationsOnly() {
      const route = routeFromHash();
      if (route.name !== 'applications') return;
      document.getElementById('app').innerHTML = renderApplications();
      bindGlobal();
      bindApplications();
      const search = document.querySelector('[data-filter-search]');
      search?.focus();
      if (search) search.setSelectionRange(search.value.length, search.value.length);
    }

    function bindDetail(candidate) {
      loadPdfPreview(candidate.id);
      document.querySelectorAll('[data-rerun]').forEach(button => button.addEventListener('click', () => rerunModal(getCandidate(button.dataset.rerun))));
      document.querySelectorAll('[data-delete-candidate]').forEach(button => button.addEventListener('click', () => deleteCandidateModal(getCandidate(button.dataset.deleteCandidate))));
      document.querySelectorAll('[data-decision]').forEach(button => button.addEventListener('click', () => {
        candidate.decision = button.dataset.decision;
        render();
        showToast('Human decision saved', `${candidate.name} is marked ${button.dataset.decision.toLowerCase()}.`);
      }));
      document.querySelector('[data-save-note]')?.addEventListener('click', () => showToast('Internal note saved', 'The note is visible only to staff.'));
      document.querySelector('[data-compare-candidate]')?.addEventListener('click', () => {
        state.compare.applicationId = candidate.id;
        state.compare.left = candidate.runs[0]?.id;
        state.compare.right = candidate.runs[1]?.id || candidate.runs[0]?.id;
        navigate('/staff/experiments');
      });
      document.querySelectorAll('[data-artifact]').forEach(button => button.addEventListener('click', () => artifactModal(button.dataset.artifact)));
    }

    function bindExperiments() {
      document.querySelector('[data-compare-candidate-select]')?.addEventListener('change', event => {
        const candidate = getCandidate(event.target.value);
        state.compare.applicationId = candidate.id;
        state.compare.left = candidate.runs[0]?.id;
        state.compare.right = candidate.runs[1]?.id || candidate.runs[0]?.id;
        render();
      });
      document.querySelector('[data-compare-left]')?.addEventListener('change', event => { state.compare.left = event.target.value; render(); });
      document.querySelector('[data-compare-right]')?.addEventListener('change', event => { state.compare.right = event.target.value; render(); });
      document.querySelector('[data-swap-runs]')?.addEventListener('click', () => { [state.compare.left,state.compare.right] = [state.compare.right,state.compare.left]; render(); });
      document.querySelectorAll('[data-rerun]').forEach(button => button.addEventListener('click', () => rerunModal(getCandidate(button.dataset.rerun))));
    }

    function bindModels() {
      document.querySelectorAll('[data-set-default-model]').forEach(button => button.addEventListener('click', async () => {
        button.disabled = true;
        await mockApi.setDefaultModel(button.dataset.setDefaultModel);
        state.defaultModel = button.dataset.setDefaultModel;
        render();
        showToast('Default model updated', `${currentModel().name} will be used for future runs.`);
      }));
    }

    function bindRuns() {
      document.querySelector('[data-run-status]')?.addEventListener('change', event => { state.runFilters.status = event.target.value; render(); });
      document.querySelector('[data-run-model]')?.addEventListener('change', event => { state.runFilters.model = event.target.value; render(); });
      document.querySelectorAll('[data-open-application]').forEach(button => button.addEventListener('click', () => navigate(`/staff/application/${button.dataset.openApplication}`)));
      document.querySelectorAll('[data-rerun]').forEach(button => button.addEventListener('click', () => rerunModal(getCandidate(button.dataset.rerun))));
    }

    function bindDemo() {
      document.querySelector('[data-seed-demo]')?.addEventListener('click', () => showToast('Demo data ready', 'Five candidates and their historical runs are available.'));
      document.querySelector('[data-reset-demo]')?.addEventListener('click', async () => {
        showModal(`<div class="modal-head"><div><div class="eyebrow">Reset demonstration</div><h2>Restore demo data?</h2></div><button class="btn btn-square btn-ghost" data-close-modal>${icons.close}</button></div><div class="modal-body"><p class="muted">This mock resets the visible state. The real endpoint should remove only records tagged as demo data.</p></div><div class="modal-actions"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-danger" data-confirm-reset>Reset data</button></div>`);
        document.querySelector('[data-confirm-reset]')?.addEventListener('click', async () => { await mockApi.resetDemo(); await syncStaffData(); closeModal(); render(); showToast('Demo reset complete', 'The fixed presentation state has been restored.'); });
      });
      document.querySelectorAll('[data-set-defense]').forEach(button => button.addEventListener('click', async () => {
        await mockApi.setDefaultDefenseProfile(button.dataset.setDefense);
        state.defaultDefenseProfile = button.dataset.setDefense;
        render();
        showToast('Defense profile selected', `${currentDefenseProfile().name} is ready for the next run.`);
      }));
    }

    function bindModalActions() {
      document.querySelectorAll('[data-confirm-rerun]').forEach(button => {
        if (button.dataset.bound) return;
        button.dataset.bound = 'true';
        button.addEventListener('click', async () => {
        const candidate = getCandidate(button.dataset.confirmRerun);
        const selectedDefense = document.getElementById('rerunDefense').value;
        const selectedModel = document.getElementById('rerunModel').value;
        if (selectedDefense === 'v3_vlm' && selectedModel !== 'qwen3-vl-plus') {
          showToast('Select Qwen3-VL Plus', 'V3-VLM uses rendered PDF pages and cannot run with a text-only model.', 'warning');
          return;
        }
        button.disabled = true;
        button.textContent = 'Queueing run…';
        const config = {
          model: selectedModel,
          temperature: Number(document.getElementById('rerunTemperature').value),
          topP: Number(document.getElementById('rerunTopP').value),
          prompt: document.getElementById('rerunPrompt').value,
          cache: document.getElementById('rerunCache').value,
          github: document.getElementById('rerunGithub').checked,
          defense_profile: selectedDefense,
          github_fixture_id: document.getElementById('rerunGithubFixture').value
        };
        try {
          const result = await mockApi.rerun(candidate.id, config);
          await syncStaffData();
          closeModal();
          showToast(result.reused ? 'Existing evaluation reused' : 'Evaluation queued', result.reused ? 'A matching completed run already exists.' : `Run ${result.id} is now visible in System Runs.`);
          render();
        } catch (error) {
          button.disabled = false;
          button.innerHTML = `${icons.refresh} Run evaluation`;
          showToast('Rerun failed', error.message, 'danger');
        }
        });
      });
      document.querySelectorAll('[data-confirm-delete]').forEach(button => {
        if (button.dataset.bound) return;
        button.dataset.bound = 'true';
        button.addEventListener('click', async () => {
        const candidate = getCandidate(button.dataset.confirmDelete);
        button.disabled = true;
        try {
          await mockApi.deleteApplication(candidate.id);
          await syncStaffData();
          closeModal();
          navigate('/staff/applications');
          showToast('Application deleted', `${candidate.name} and its local run data were removed.`);
        } catch (error) {
          button.disabled = false;
          showToast('Delete failed', error.message, 'danger');
        }
        });
      });
    }

    function render() {
      const route = routeFromHash();
      state.mobileNavOpen = false;
      let html;
      if (route.name === 'login') html = renderLogin();
      else if (route.name === 'candidate') html = renderCandidate();
      else if (route.name === 'applications') html = renderApplications();
      else if (route.name === 'application-detail') html = renderApplicationDetail(route.id);
      else if (route.name === 'experiments') html = renderExperiments();
      else if (route.name === 'models') html = renderModels();
      else if (route.name === 'runs') html = renderRuns();
      else if (route.name === 'demo') html = renderDemoControls();
      else html = renderLogin();
      document.getElementById('app').innerHTML = html;
      bindGlobal();
      if (route.name === 'login') bindLogin();
      if (route.name === 'candidate') bindCandidate();
      if (route.name === 'applications') bindApplications();
      if (route.name === 'application-detail') bindDetail(getCandidate(route.id));
      if (route.name === 'experiments') bindExperiments();
      if (route.name === 'models') bindModels();
      if (route.name === 'runs') bindRuns();
      if (route.name === 'demo') bindDemo();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    window.addEventListener('hashchange', render);
    window.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    document.addEventListener('click', event => {
      if (event.target.closest('[data-close-modal]')) closeModal();
    });
    render();
  </script>
</body>
</html>
